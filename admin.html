
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>NuvionCloud | Admin</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #101827;
  color: white;
  min-height: 100vh;
}

header {
  padding: 22px 6%;
  border-bottom: 1px solid #29394e;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-size: 23px;
  font-weight: bold;
}

.brand span {
  color: #3996ff;
}

.tag {
  background: #172d48;
  color: #3996ff;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 12px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 18px;
}

.panel {
  background: #172337;
  border: 1px solid #2b3d55;
  padding: 25px;
  border-radius: 14px;
  margin-bottom: 22px;
}

h1 {
  font-size: 26px;
  margin-bottom: 10px;
}

h2 {
  font-size: 19px;
  margin-bottom: 8px;
}

.muted {
  color: #93a4ba;
  font-size: 13px;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 14px;
  background: #101827;
  border: 1px solid #344861;
  border-radius: 8px;
  color: white;
  outline: none;
  margin-top: 14px;
}

input:focus {
  border-color: #3996ff;
}

button {
  border: none;
  padding: 13px 17px;
  background: #3996ff;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

button:hover {
  opacity: .9;
}

.login-button {
  width: 100%;
  margin-top: 15px;
}

.logout {
  background: #29394e;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.actions {
  display: flex;
  gap: 10px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 25px;
}

.stat {
  background: #101827;
  border: 1px solid #2b3d55;
  padding: 20px;
  border-radius: 10px;
}

.stat strong {
  display: block;
  color: #3996ff;
  font-size: 28px;
  margin-top: 8px;
}

.table-wrap {
  overflow-x: auto;
  margin-top: 20px;
}

table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  text-align: left;
}

th, td {
  padding: 15px 12px;
  border-bottom: 1px solid #29394e;
  font-size: 13px;
}

th {
  color: #93a4ba;
}

.uid {
  color: #93a4ba;
  font-size: 11px;
  overflow-wrap: anywhere;
}

#loginMessage {
  margin-top: 16px;
  color: #ffaaaa;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#tableMessage {
  margin-top: 15px;
}

.hidden {
  display: none !important;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #93a4ba;
}

@media(max-width: 600px) {
  header {
    padding: 20px;
  }

  main {
    padding: 22px 12px;
  }

  .panel {
    padding: 18px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .toolbar {
    align-items: stretch;
  }

  .actions {
    width: 100%;
  }

  .actions button {
    flex: 1;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">☁ Nuvion<span>Cloud</span></div>
  <div class="tag">ADMINISTRAÇÃO</div>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginArea" class="panel">
    <h1>Painel administrativo</h1>
    <p class="muted">Entre com sua conta de administrador.</p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="E-mail do administrador"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Senha"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" class="login-button" type="submit">
        Entrar no painel
      </button>
    </form>

    <div id="loginMessage"></div>
  </section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="hidden">

    <div class="panel">
      <div class="toolbar">
        <div>
          <h1>Visão geral</h1>
          <p class="muted">Gerenciamento de usuários.</p>
        </div>

        <div class="actions">
          <button id="refreshButton">↻ Atualizar</button>
          <button class="logout" id="logoutButton">Sair</button>
        </div>
      </div>

      <p class="muted" id="adminEmail"></p>

      <div class="stats">
        <div class="stat">
          <span class="muted">Total de usuários</span>
          <strong id="totalUsers">0</strong>
        </div>

        <div class="stat">
          <span class="muted">Encontrados</span>
          <strong id="visibleUsers">0</strong>
        </div>
      </div>
    </div>


    <div class="panel">
      <h2>Usuários cadastrados</h2>
      <p class="muted">Registros armazenados no Firestore.</p>

      <input
        type="search"
        id="searchInput"
        placeholder="Pesquisar e-mail ou UID..."
      >

      <p class="muted" id="tableMessage"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>E-mail</th>
              <th>UID</th>
              <th>Último login</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>

      <div id="emptyMessage" class="empty hidden">
        Nenhum usuário encontrado.
      </div>
    </div>

  </section>

</main>


<script type="module">

// IMPORTAÇÕES FIREBASE

import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs
} from
"https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";


// CONFIGURAÇÃO DO PROJETO

const firebaseConfig = {
  apiKey: "AIzaSyD-fg6OjiInXJBZJwfPF7iJ-6ZY6_CzSxY",
  authDomain: "nuvioncloud.firebaseapp.com",
  projectId: "nuvioncloud",
  storageBucket: "nuvioncloud.firebasestorage.app",
  messagingSenderId: "238265616692",
  appId: "1:238265616692:web:88d6c38c8443169ffd7d61"
};


// UID DO ADMINISTRADOR

const ADMIN_UID = "7xeOkdeRaPXUkOA0A6Dvz9o1Ctr2";


// INICIALIZAÇÃO

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// ELEMENTOS

const loginArea = document.getElementById("loginArea");
const dashboard = document.getElementById("dashboard");
const loginMessage = document.getElementById("loginMessage");
const tableMessage = document.getElementById("tableMessage");
const usersTable = document.getElementById("usersTable");

let allUsers = [];


// MOSTRAR LOGIN

function showLogin() {
  loginArea.classList.remove("hidden");
  dashboard.classList.add("hidden");
}


// MOSTRAR PAINEL

function showDashboard(user) {
  loginArea.classList.add("hidden");
  dashboard.classList.remove("hidden");

  document.getElementById("adminEmail").textContent =
    "Administrador: " + (user.email || "");
}


// FORMATAÇÃO DE ERRO

function showFirebaseError(error) {
  console.error("ERRO FIREBASE:", error);

  const messages = {
    "auth/invalid-credential":
      "E-mail ou senha incorretos.",

    "auth/user-not-found":
      "Conta não encontrada.",

    "auth/wrong-password":
      "Senha incorreta.",

    "auth/invalid-email":
      "E-mail inválido.",

    "auth/too-many-requests":
      "Muitas tentativas. Aguarde alguns minutos.",

    "auth/operation-not-allowed":
      "Login por e-mail e senha não está ativado.",

    "auth/network-request-failed":
      "Falha de conexão com o Firebase.",

    "auth/unauthorized-domain":
      "Este domínio não está autorizado no Firebase.",

    "permission-denied":
      "O Firestore negou acesso. Confira suas regras."
  };

  loginMessage.textContent =
    "Erro: " + error.code + " — " +
    (messages[error.code] || error.message || "Erro desconhecido.");
}


// FORMATAR DATA

function formatDate(timestamp) {
  if (!timestamp || typeof timestamp.toDate !== "function") {
    return "Não registrado";
  }

  return timestamp.toDate().toLocaleString("pt-BR");
}


// MOSTRAR USUÁRIOS

function renderUsers(users) {
  usersTable.replaceChildren();

  document.getElementById("totalUsers").textContent =
    allUsers.length;

  document.getElementById("visibleUsers").textContent =
    users.length;

  document.getElementById("emptyMessage")
    .classList.toggle("hidden", users.length > 0);

  users.forEach(user => {
    const row = document.createElement("tr");

    const email = document.createElement("td");
    email.textContent = user.email || "Sem e-mail";

    const uid = document.createElement("td");
    uid.className = "uid";
    uid.textContent = user.uid || "";

    const date = document.createElement("td");
    date.textContent = formatDate(user.lastLogin);

    row.append(email, uid, date);
    usersTable.appendChild(row);
  });
}


// CARREGAR USUÁRIOS

async function loadUsers() {
  const button = document.getElementById("refreshButton");

  button.disabled = true;
  button.textContent = "Carregando...";
  tableMessage.textContent = "Buscando usuários...";

  try {
    const snapshot = await getDocs(collection(db, "users"));

    allUsers = snapshot.docs.map(item => ({
      ...item.data(),
      uid: item.id
    }));

    allUsers.sort((a, b) => {
      const dateA = a.lastLogin?.toMillis?.() || 0;
      const dateB = b.lastLogin?.toMillis?.() || 0;

      return dateB - dateA;
    });

    renderUsers(allUsers);

    tableMessage.textContent =
      "Lista atualizada com sucesso.";

  } catch (error) {
    console.error("ERRO AO BUSCAR USUÁRIOS:", error);

    tableMessage.textContent =
      "Erro: " + error.code + " — " + error.message;

  } finally {
    button.disabled = false;
    button.textContent = "↻ Atualizar";
  }
}


// LOGIN ADMINISTRADOR

document.getElementById("loginForm")
.addEventListener("submit", async (event) => {

  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const button = document.getElementById("loginButton");

  loginMessage.textContent = "";
  button.disabled = true;
  button.textContent = "Verificando...";

  try {
    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);

      loginMessage.textContent =
        "Acesso negado: UID não autorizado.";

      return;
    }

    loginMessage.textContent = "";

  } catch (error) {
    showFirebaseError(error);

  } finally {
    button.disabled = false;
    button.textContent = "Entrar no painel";
  }

});


// VERIFICAR SESSÃO

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    showLogin();
    return;
  }

  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    showLogin();

    loginMessage.textContent =
      "Acesso permitido somente ao administrador.";

    return;
  }

  showDashboard(user);
  await loadUsers();

});


// PESQUISAR USUÁRIOS

document.getElementById("searchInput")
.addEventListener("input", (event) => {

  const search = event.target.value.toLowerCase().trim();

  const filtered = allUsers.filter(user => {

    return (
      (user.email || "").toLowerCase().includes(search) ||
      (user.uid || "").toLowerCase().includes(search)
    );

  });

  renderUsers(filtered);

});


// ATUALIZAR

document.getElementById("refreshButton")
.addEventListener("click", () => {

  if (auth.currentUser?.uid === ADMIN_UID) {
    loadUsers();
  }

});


// SAIR

document.getElementById("logoutButton")
.addEventListener("click", async () => {

  try {
    await signOut(auth);

    document.getElementById("password").value = "";
    loginMessage.textContent = "";

  } catch (error) {
    console.error(error);
    loginMessage.textContent = error.message;
  }

});

</script>

</body>
</html>
